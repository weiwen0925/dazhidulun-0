 readRows.push({ic:SL6[s6][0].charAt(0),nm:SL6[s6][0],sub:"深廣行 · 品讀跡",
  n:cnt3("wySeen2:"+SL6[s6][1]),t:SL6[s6][2],u:U+SL6[s6][1]+"/"});
}

var rw=document.getElementById("xzRows"),readN=0;
for(var r=0;r<readRows.length;r++){
 var it=readRows[r];readN+=it.n;
 var pc=Math.min(100,Math.round(it.n*100/it.t));
 var d2=document.createElement("div");
 d2.className="row";
 d2.innerHTML='<span class="ic">'+it.ic+'</span>'
  +'<span class="nm">'+it.nm+'<small>'+it.sub+'</small></span>'
  +'<span class="bar"><i data-w="'+pc+'" style="width:0"></i></span>'
  +'<span class="ct">'+it.n+' / '+it.t+'</span>'
  +'<a href="'+it.u+'" target="_blank" rel="noopener">前往 ▸</a>';
 rw.appendChild(d2);
}
setTimeout(function(){var bs=document.querySelectorAll(".bar i");for(var b2=0;b2<bs.length;b2++)bs[b2].style.width=bs[b2].getAttribute("data-w")+"%";},120);
document.getElementById("xzTot").innerHTML=
 "已讀 <b>"+readN+"</b> 處 ・ 已過 <b>"+questN+"</b> 關 ・ 得印 <b>"+gotN+"</b> ／ "+SEALS.length+" 方";

var merit=readN+questN;
var RK=[[0,"初發心","初階","發菩提心，長征第一步","發心"],
 [30,"聞思行者","初階","多聞熏習，如理思惟","聞思行者"],
 [100,"精進行者","中階","六度之進，晝夜不懈","精進行者"],
 [250,"不退行者","中階","阿鞞跋致，得無生忍不復退轉","不退行者"],
 [500,"般若行者","進階","深入般若波羅蜜，觀諸法實相","般若行者"],
 [800,"薩婆若海","圓成","一切智海——大智度論之所歸","薩婆若海"]];
var ri=0;for(var r2=0;r2<RK.length;r2++)if(merit>=RK[r2][0])ri=r2;
var cur=RK[ri],nxt=(ri+1<RK.length)?RK[ri+1]:null;
var hint=nxt?("續讀 "+(nxt[0]-merit)+" 處，晉「"+nxt[1]+"」"):"智度大海，唯佛窮底——願與眾生同證";
var lad="";for(var l2=0;l2<RK.length;l2++)lad+='<i class="'+(l2<=ri?"on":"")+'" title="'+RK[l2][1]+'（'+RK[l2][0]+'+）"></i>';
document.getElementById("xzRank").innerHTML=
 '<span class="rk" title="'+cur[3]+'">'+cur[1]+'<em>'+cur[2]+'</em></span>'
 +'<div class="lad">'+lad+'</div>'
 +'<small>'+hint+'（讀處＋過關合計 '+merit+'）</small>';

document.body.className="xzr"+ri;
var rseen=parseInt(G("wyXzRankSeen")||"",10);
if(isNaN(rseen))rseen=-1;
if(ri>rseen){
 if(!(rseen===-1&&ri===0)){
  var cv=document.createElement("div");cv.id="xzCert";
  cv.innerHTML='<div class="certcard"><div class="kk">晉 階 之 證</div>'
   +'<h3>'+cur[1]+'<em>'+cur[2]+'</em></h3>'
   +'<div class="who">'+(function(){var nm=xzGetName();return nm==="行者"?nm:nm+"行者";})()+' ・ 已讀 '+readN+' 處 ・ 已過 '+questN+' 關</div>'
   +'<div class="sq2">'+face2(cur[4]||cur[1])+'</div>'
   +'<div class="quote">'+cur[3]+'</div>'
   +'<button id="xzCertOk">領 受</button></div>';
  document.body.appendChild(cv);
  setTimeout(function(){cv.classList.add("on");},250);
  cv.addEventListener("click",function(e){
   if(e.target.id==="xzCertOk"||e.target===cv)cv.classList.remove("on");});
 }
 try{localStorage.setItem("wyXzRankSeen",String(ri));}catch(e){}
}

var PRE=["zlSeen2","zlPin","zlQuest","dzSeen2","dzLaps","dzGate","dzQuest","wySeen2:","wySeen:yuku",
 "wyLaps:","wyDone:","wyQuest","ykQ","dzEQ","wyEssayDone:","wyEssayTick:","wyXingzheSnap","ykSeen","dzSeen","wyXzName","wyXzRank"];
function allKeys(){
 var out={};
 try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
  for(var p=0;p<PRE.length;p++){if(k.indexOf(PRE[p])===0){out[k]=localStorage.getItem(k);break;}}}}catch(e){}
 return out;
}
document.getElementById("xzExp").addEventListener("click",function(){
 var o=allKeys();
 var ta=document.getElementById("xzIO");
 ta.value=JSON.stringify(o);
 ta.select();
 try{document.execCommand("copy");}catch(e){}
 alert("行囊已打包（並已嘗試複製）——把這段文字帶到新裝置貼入即可。");
});
document.getElementById("xzImp").addEventListener("click",function(){
 var ta=document.getElementById("xzIO");
 try{
  var o=JSON.parse(ta.value);var n=0;
  for(var k in o){localStorage.setItem(k,o[k]);n++;}
  alert("已安放 "+n+" 筆記錄——重新整理即見。");location.reload();
 }catch(e){alert("行囊文字不完整——請確認貼入的是整段打包文字。");}
});
document.getElementById("xzZero").addEventListener("click",function(){
 if(!confirm("確定把這台裝置上的全部讀跡與闖關記錄歸零？此動作不可復原。"))return;
 if(!confirm("再確認一次：全部歸零？"))return;
 var o=allKeys();for(var k in o){try{localStorage.removeItem(k);}catch(e){}}
 alert("已歸零。");location.reload();
});
}catch(e){}})();
</script>
</body>
</html>
